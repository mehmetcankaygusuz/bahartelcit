# Siteyi sunucuya yükler. Gerekli GitHub Secrets: SSH_HOST, SSH_USER, SSH_PASSWORD (veya SSH_KEY), isteğe bağlı SSH_PORT
name: Siteyi yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: yayinla
jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Sunucu bilgileri girildi mi?
        id: kontrol
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || { [ -z "$SSH_PASSWORD" ] && [ -z "$SSH_KEY" ]; }; then
            echo "::warning::SSH_HOST, SSH_USER ve SSH_PASSWORD (veya SSH_KEY) secret'ları girilmemiş, yayın atlandı."
            echo "hazir=0" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Bağlantıyı hazırla
        if: steps.kontrol.outputs.hazir == '1'
        run: |
          sudo apt-get install -y -qq sshpass rsync >/dev/null
          mkdir -p ~/.ssh
          OPTS="-p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new"
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_key && chmod 600 ~/.ssh/id_key
            echo "SSH_CMD=ssh $OPTS -i $HOME/.ssh/id_key" >> "$GITHUB_ENV"
          else
            echo "SSH_CMD=sshpass -e ssh $OPTS" >> "$GITHUB_ENV"
          fi
      - name: Sunucu ayarı (Nginx/Apache + SSL)
        if: steps.kontrol.outputs.hazir == '1'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set +e
          $SSH_CMD "$SSH_USER@$SSH_HOST" 'cat > /tmp/bahartelcit-kurulum.sh' < sunucu/kurulum.sh
          $SSH_CMD "$SSH_USER@$SSH_HOST" 'cat > /tmp/bahartelcit-eski.conf' < sunucu/eski-adresler.conf
          if [ "$SSH_USER" = "root" ]; then KOMUT="bash /tmp/bahartelcit-kurulum.sh"; else KOMUT="sudo -S -p '' bash /tmp/bahartelcit-kurulum.sh $SSH_USER"; fi
          printf '%s\n' "$SSH_PASSWORD" | $SSH_CMD "$SSH_USER@$SSH_HOST" "$KOMUT" > cikti.txt 2>&1; rc=$?
          cat cikti.txt
          grep -iE 'SSL|certbot|HATA|UYARI|error|Nginx|Apache|Congratulations|Successfully' cikti.txt | tail -n 9 | while IFS= read -r l; do echo "::notice::$l"; done
          exit $rc
      - name: Dosyaları yükle
        if: steps.kontrol.outputs.hazir == '1'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set +e
          rsync -rz --delete --chmod=D755,F644 -e "$SSH_CMD" site/ "$SSH_USER@$SSH_HOST:/var/www/bahartelcit.com/" > cikti.txt 2>&1; rc=$?
          cat cikti.txt
          tail -n 12 cikti.txt | while IFS= read -r l; do echo "::notice::$l"; done
          [ $rc -eq 0 ] && echo "::notice::Site yüklendi."
          exit $rc
      - name: Alan adı (DNS) kontrolü
        if: steps.kontrol.outputs.hazir == '1'
        run: |
          IP=$(dig +short bahartelcit.com A | tail -n1)
          CF=$(curl -sI --max-time 15 https://bahartelcit.com/ | grep -ci '^server: cloudflare' || true)
          if [ -z "$IP" ]; then echo "::warning::bahartelcit.com DNS kaydı yok."
          elif [ "$IP" = "$SSH_HOST" ]; then echo "::notice::bahartelcit.com DNS kaydı doğrudan sunucuyu gösteriyor."
          elif [ "$CF" -gt 0 ] || dig +short bahartelcit.com NS | grep -qi cloudflare; then echo "::notice::bahartelcit.com Cloudflare üzerinden yayında."
          else echo "::warning::bahartelcit.com beklenmeyen bir IP'yi gösteriyor ($IP)."; fi
          if dig +short TXT bahartelcit.com | grep -q google-site-verification; then echo "::notice::Search Console doğrulama kaydı (TXT) DNS'te görünüyor."
          else echo "::warning::Search Console doğrulama kaydı (TXT) DNS'te bulunamadı."; fi
      - name: Site açılıyor mu?
        if: steps.kontrol.outputs.hazir == '1'
        run: |
          H=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://bahartelcit.com/ || true)
          W=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.bahartelcit.com/ || true)
          P=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://bahartelcit.com/ || true)
          T=$(curl -s --max-time 20 https://bahartelcit.com/ | grep -o '<title>[^<]*' | head -1 || true)
          S=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 https://solimena.com.tr/ || true)
          echo "::notice::Aynı sunucudaki solimena.com.tr -> $S"
          for u in /catalca-gokceali-panel-cit /kadikoy-panel-cit /hizmetler/silivri-ortakoy-cim-cit /eski-sayfa-panel-cit /silivri-ortakoy-tel-cit/ /silivri-panel-cit/ /tel-cit/; do
            echo "::notice::Adres $u -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 https://bahartelcit.com$u || true)"
          done
          [ "$H" = "000" ] && echo "::warning::https hatası: $(curl -sS -o /dev/null --max-time 20 https://bahartelcit.com/ 2>&1 | head -c 200)"
          echo "::notice::https://bahartelcit.com -> $H, https://www -> $W, http -> $P, başlık: ${T#<title>}"
      - name: Arama motorlarına bildir (IndexNow)
        if: steps.kontrol.outputs.hazir == '1'
        run: |
          KEY=$(jq -r '.indexNowKey // empty' kaynak/config.json)
          [ -z "$KEY" ] && exit 0
          URLS=$(grep -o '<loc>[^<]*' site/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -s .)
          BODY=$(jq -n --arg k "$KEY" --argjson u "$URLS" '{host:"bahartelcit.com",key:$k,keyLocation:("https://bahartelcit.com/"+$k+".txt"),urlList:$u}')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" || true)
          echo "::notice::IndexNow (Bing, Yandex) bildirimi: HTTP $CODE"
